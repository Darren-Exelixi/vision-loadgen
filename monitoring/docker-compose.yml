# Prometheus + Grafana for load generator runs. From the repository root:
#   docker compose -f monitoring/docker-compose.yml up -d
# then open http://localhost:3000 (dashboard "vision-loadgen"). The load generator serves its
# metrics when LOADGEN_METRICS_PORT is set; Prometheus finds it through
# prometheus/targets/*.json (edited live, no restart).
name: vision-loadgen-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-90d}
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      # Docker Desktop defines it already; this makes it work on Linux too.
      - host.docker.internal:host-gateway
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:12.1.1
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/vision-loadgen.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
