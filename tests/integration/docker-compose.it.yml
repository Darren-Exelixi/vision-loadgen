# Throwaway Postgres + Kafka for tests/integration. Started and removed by the test fixture.
#
# `compat` runs the whole suite on the workers' Python and pinned libraries instead of the host's:
#   docker compose -f tests/integration/docker-compose.it.yml -p loadgen-it up -d --wait postgres kafka
#   docker compose -f tests/integration/docker-compose.it.yml -p loadgen-it run --rm compat
#   docker compose -f tests/integration/docker-compose.it.yml -p loadgen-it down -v
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: it
      POSTGRES_PASSWORD: it
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "it"]
      interval: 2s
      retries: 30

  kafka:
    image: apache/kafka:3.8.0
    ports: ["59092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:59092,INTERNAL://kafka:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1

  compat:
    profiles: [compat]
    image: python:3.11-slim
    depends_on: [postgres, kafka]
    working_dir: /src
    volumes: ["../..:/src:ro"]
    environment:
      LOADGEN_IT: "1"
      LOADGEN_IT_STACK: external
      LOADGEN_IT_PG: postgresql://it:it@postgres:5432/{}
      LOADGEN_IT_BOOTSTRAP: kafka:19092
      PYTHONPATH: /src
      PYTHONDONTWRITEBYTECODE: "1"
    # The versions the crowd worker image pins (requirements.txt), for the libraries loadgen uses.
    command: >
      sh -c "pip install -q --root-user-action=ignore kafka-python==2.0.2 pydantic==2.5.3
      python-dotenv==1.0.0 psycopg2-binary==2.9.9 'python-jose[cryptography]' PyYAML pytest
      && python -m pytest -q -p no:cacheprovider"
